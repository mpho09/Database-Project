<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pulse — live earthquake feed</title>

  <style>
    :root {
      --bg: #0c0d0f;
      --panel: #141518;
      --line: #2a2b2e;
      --text: #e8e6e1;
      --muted: #8a8983;
      --dim: #6f6e69;
      --accent: #c2704a;
      --live: #6fae76;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    }

    .wrap { max-width: 760px; margin: 0 auto; padding: 56px 24px; }

    header { border-bottom: 1px solid var(--line); padding-bottom: 24px; margin-bottom: 40px; }

    .eyebrow-row { display: flex; align-items: center; gap: 8px; }

    .eyebrow {
      font-size: 12px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--dim);
      transition: background 0.2s ease;
    }

    .live-dot.connected {
      background: var(--live);
      box-shadow: 0 0 0 0 rgba(111, 174, 118, 0.5);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(111, 174, 118, 0.4); }
      70% { box-shadow: 0 0 0 6px rgba(111, 174, 118, 0); }
      100% { box-shadow: 0 0 0 0 rgba(111, 174, 118, 0); }
    }

    h1 { font-size: 32px; font-weight: 700; margin: 8px 0 0; letter-spacing: -0.02em; }

    .subtitle { color: var(--muted); font-size: 14px; margin: 8px 0 0; }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 24px;
      font-size: 14px;
      margin-bottom: 32px;
    }

    .field { display: flex; flex-direction: column; gap: 4px; }
    .field span { color: var(--muted); }

    select {
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 6px 8px;
      border-radius: 4px;
      font-family: inherit;
    }

    input[type="range"] { width: 190px; accent-color: var(--accent); }

    .count { margin-left: auto; color: var(--muted); }

    ul { list-style: none; margin: 0; padding: 0; }

    li {
      display: flex;
      gap: 16px;
      align-items: baseline;
      border-left: 2px solid var(--line);
      padding: 12px 0 12px 16px;
      transition: border-color 0.15s ease;
    }

    li:hover { border-left-color: var(--accent); }

    .mag { width: 56px; flex-shrink: 0; text-align: right; font-size: 18px; font-weight: 700; }
    .mag.strong { color: var(--accent); }

    .meta { min-width: 0; flex: 1; }

    .place { margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .detail { margin: 2px 0 0; font-size: 12px; color: var(--dim); }

    .empty { text-align: center; color: var(--dim); padding: 40px 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="eyebrow-row">
        <p class="eyebrow">Live feed &middot; USGS</p>
        <span class="live-dot" id="liveDot"></span>
      </div>
      <h1>Pulse</h1>
      <p class="subtitle">Every recorded tremor in the last 24 hours, updating on its own.</p>
    </header>

    <div class="controls">
      <label class="field">
        <span id="magLabel">Min magnitude: 0.0</span>
        <input type="range" id="magFilter" min="0" max="7" step="0.5" value="0" />
      </label>

      <label class="field">
        <span>Sort by</span>
        <select id="sortSelect">
          <option value="time">Most recent</option>
          <option value="magnitude">Strongest first</option>
        </select>
      </label>

      <span class="count" id="count">loading…</span>
    </div>

    <ul id="list"></ul>
    <p class="empty" id="empty" style="display: none;"></p>
  </div>

  <script>
    let allQuakes = [];

    const listEl = document.getElementById("list");
    const emptyEl = document.getElementById("empty");
    const countEl = document.getElementById("count");
    const magFilter = document.getElementById("magFilter");
    const magLabel = document.getElementById("magLabel");
    const sortSelect = document.getElementById("sortSelect");
    const liveDot = document.getElementById("liveDot");

    function render() {
      const minMag = parseFloat(magFilter.value);
      const sortKey = sortSelect.value;

      let visible = allQuakes.filter((q) => (q.magnitude ?? 0) >= minMag);
      visible.sort((a, b) => {
        if (sortKey === "magnitude") return (b.magnitude ?? 0) - (a.magnitude ?? 0);
        return new Date(b.event_time) - new Date(a.event_time);
      });

      countEl.textContent = `${visible.length} shown`;
      listEl.innerHTML = "";

      if (visible.length === 0) {
        emptyEl.style.display = "block";
        emptyEl.textContent = `Nothing at or above magnitude ${minMag.toFixed(1)} right now.`;
        return;
      }
      emptyEl.style.display = "none";

      for (const q of visible) {
        const li = document.createElement("li");

        const mag = document.createElement("span");
        mag.className = "mag" + ((q.magnitude ?? 0) >= 5 ? " strong" : "");
        mag.textContent = q.magnitude != null ? q.magnitude.toFixed(1) : "—";

        const meta = document.createElement("div");
        meta.className = "meta";

        const place = document.createElement("p");
        place.className = "place";
        place.textContent = q.place || "Unknown location";

        const detail = document.createElement("p");
        detail.className = "detail";
        let detailText = `${new Date(q.event_time).toLocaleString()} · depth ${Math.round(q.depth_km ?? 0)} km`;
        if (q.weather_temp_c != null) {
          detailText += ` · ${Math.round(q.weather_temp_c)}°C, wind ${Math.round(q.weather_wind_kmh ?? 0)} km/h`;
        }
        detail.textContent = detailText;

        meta.appendChild(place);
        meta.appendChild(detail);
        li.appendChild(mag);
        li.appendChild(meta);
        listEl.appendChild(li);
      }
    }

    magFilter.addEventListener("input", () => {
      magLabel.textContent = `Min magnitude: ${parseFloat(magFilter.value).toFixed(1)}`;
      render();
    });
    sortSelect.addEventListener("change", render);

    // Initial load: plain fetch, so the page has data before the stream connects.
    fetch("/api/earthquakes")
      .then((r) => r.json())
      .then((rows) => {
        allQuakes = rows;
        render();
      });

    // Live updates: the server pushes a fresh snapshot every time it polls USGS.
    const stream = new EventSource("/api/stream");
    stream.onopen = () => liveDot.classList.add("connected");
    stream.onerror = () => liveDot.classList.remove("connected");
    stream.onmessage = (event) => {
      allQuakes = JSON.parse(event.data);
      render();
    };
  </script>
</body>
</html>
